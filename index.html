<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英文學習助手</title>
<style>
:root{
  --bg:#0f172a;
  --surface:#1e293b;
  --surface2:#263347;
  --border:#334155;
  --accent:#a78bfa;
  --accent2:#7c3aed;
  --glow:rgba(167,139,250,.18);
  --text:#f1f5f9;
  --text2:#94a3b8;
  --text3:#64748b;
  --green:#34d399;
  --green-bg:rgba(52,211,153,.08);
  --green-border:rgba(52,211,153,.25);
  --red:#f87171;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans TC',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  background-image:radial-gradient(ellipse at 20% 0%,rgba(124,58,237,.12) 0%,transparent 60%),
                   radial-gradient(ellipse at 80% 100%,rgba(167,139,250,.08) 0%,transparent 60%);
}

/* overlay / modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:200}
.overlay.hide{display:none}
.modal{
  background:var(--surface);border:1px solid var(--border);border-radius:20px;
  padding:32px;width:min(480px,92vw);
  box-shadow:0 24px 64px rgba(0,0,0,.5),0 0 0 1px rgba(167,139,250,.1);
}
.modal h2{color:var(--text);margin-bottom:8px}
.modal p{color:var(--text2);font-size:.85rem;margin-bottom:16px}

/* header */
header{
  background:linear-gradient(135deg,#1e1b4b 0%,#312e81 50%,#1e1b4b 100%);
  padding:15px 20px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid rgba(167,139,250,.2);
  box-shadow:0 4px 24px rgba(0,0,0,.3);
  position:sticky;top:0;z-index:20;
}
header h1{font-size:1.1rem;font-weight:700;color:#e0d7ff;letter-spacing:.02em}
.header-left{display:flex;align-items:center;gap:10px}
.logo{font-size:1.5rem;filter:drop-shadow(0 0 8px rgba(167,139,250,.5))}

/* tabs */
.tabs{
  background:rgba(15,23,42,.9);backdrop-filter:blur(8px);
  display:flex;border-bottom:1px solid var(--border);
  position:sticky;top:57px;z-index:10;
}
.tab{
  flex:1;padding:13px 6px;text-align:center;
  font-weight:600;font-size:.82rem;cursor:pointer;
  border:none;background:none;color:var(--text3);
  border-bottom:2px solid transparent;transition:.25s;letter-spacing:.02em;
}
.tab.on{color:var(--accent);border-bottom-color:var(--accent);text-shadow:0 0 12px var(--glow)}
.tab:hover{color:var(--text2);background:rgba(167,139,250,.05)}

/* pages */
.page{display:none;padding:18px;max-width:720px;margin:0 auto}
.page.on{display:block}

/* form */
.lbl{display:block;font-size:.78rem;font-weight:600;color:var(--text2);margin-bottom:6px;letter-spacing:.04em;text-transform:uppercase}
textarea,input[type=text],input[type=password],select{
  width:100%;background:rgba(15,23,42,.8);border:1.5px solid var(--border);
  border-radius:10px;padding:10px 14px;font-size:.95rem;font-family:inherit;
  color:var(--text);transition:border-color .2s,box-shadow .2s;
}
textarea{resize:vertical;min-height:130px;line-height:1.75}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
select option{background:var(--surface);color:var(--text)}

/* buttons */
.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:9px 18px;border-radius:10px;font-weight:600;font-size:.85rem;
  cursor:pointer;border:none;transition:all .2s;white-space:nowrap;
}
.btn:disabled{opacity:.4;cursor:not-allowed}
.blue{background:linear-gradient(135deg,#6d28d9,#7c3aed);color:#fff;box-shadow:0 4px 12px rgba(109,40,217,.3)}
.blue:hover:not(:disabled){background:linear-gradient(135deg,#5b21b6,#6d28d9);box-shadow:0 4px 20px rgba(109,40,217,.5);transform:translateY(-1px)}
.green{background:linear-gradient(135deg,#059669,#10b981);color:#fff;box-shadow:0 4px 12px rgba(5,150,105,.3)}
.green:hover:not(:disabled){background:linear-gradient(135deg,#047857,#059669);box-shadow:0 4px 20px rgba(5,150,105,.5);transform:translateY(-1px)}
.gray{background:var(--surface2);color:var(--text2);border:1px solid var(--border)}
.gray:hover{background:var(--border);color:var(--text)}
.sm{padding:5px 11px;font-size:.78rem}
.icon-btn{
  background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:8px;
  cursor:pointer;font-size:.9rem;padding:7px 10px;transition:all .2s;color:var(--text2);
}
.icon-btn:hover{background:var(--glow);color:var(--accent);border-color:var(--accent)}
.icon-btn.rec-on{background:rgba(248,113,113,.1);color:var(--red);border-color:var(--red);animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* cards */
.card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:14px;padding:18px;margin-bottom:14px;
  box-shadow:0 2px 12px rgba(0,0,0,.2);
}
.s-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:12px;padding:16px 18px;margin-bottom:10px;
  border-left:3px solid var(--accent);
  box-shadow:0 2px 10px rgba(0,0,0,.15);
  transition:transform .2s,box-shadow .2s;
}
.s-card:hover{transform:translateY(-1px);box-shadow:0 4px 20px rgba(0,0,0,.25),0 0 0 1px var(--glow)}
.s-num{
  display:inline-block;font-size:.68rem;font-weight:700;color:var(--accent);
  background:var(--glow);border:1px solid rgba(167,139,250,.3);
  border-radius:999px;padding:1px 8px;letter-spacing:.06em;margin-bottom:8px;
}
.zh{font-size:.9rem;color:var(--text2);margin-bottom:5px;line-height:1.5}
.en{font-size:1.02rem;font-weight:600;color:var(--text);line-height:1.65;margin-bottom:10px}
.en .w{cursor:pointer;border-bottom:1.5px dashed var(--border);transition:.15s}
.en .w:hover{color:var(--accent);border-bottom-color:var(--accent)}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rec-chip{
  display:inline-flex;align-items:center;gap:5px;padding:2px 9px;
  background:var(--green-bg);border:1px solid var(--green-border);
  border-radius:8px;font-size:.75rem;color:var(--green);
}

/* history */
.hist-btn{
  width:100%;text-align:left;padding:13px 16px;
  background:var(--surface);border:1px solid var(--border);border-radius:10px;
  cursor:pointer;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;
  font-size:.9rem;color:var(--text2);transition:.2s;
}
.hist-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--glow)}
.hist-detail{display:none;padding-left:10px}
.hist-detail.open{display:block}

/* practice */
.p-card{
  background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:16px 18px;margin-bottom:10px;border-left:3px solid var(--green);
  box-shadow:0 2px 10px rgba(0,0,0,.15);
}
.answer{
  display:none;margin-top:9px;padding:10px 14px;
  background:var(--green-bg);border:1px solid var(--green-border);
  border-radius:8px;color:var(--green);font-weight:600;font-size:.95rem;
}
.answer.show{display:block}

/* dict popup */
#dict{
  position:fixed;bottom:18px;right:18px;width:300px;max-height:380px;overflow-y:auto;
  background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px;
  box-shadow:0 8px 40px rgba(0,0,0,.5),0 0 0 1px var(--glow);z-index:50;display:none;
}
#dict.show{display:block}
#dict::-webkit-scrollbar{width:4px}
#dict::-webkit-scrollbar-track{background:transparent}
#dict::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* misc */
.badge{
  display:inline-block;padding:2px 9px;border-radius:999px;font-size:.72rem;font-weight:700;
  background:var(--glow);color:var(--accent);border:1px solid rgba(167,139,250,.25);
}
.sec{
  font-size:.82rem;font-weight:700;color:var(--text2);
  padding-bottom:10px;border-bottom:1px solid var(--border);margin-bottom:14px;
  letter-spacing:.06em;text-transform:uppercase;
}
.row{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.mb3{margin-bottom:12px}
.empty{text-align:center;padding:48px 20px;color:var(--text3);font-size:.95rem;line-height:1.8}

/* scrollbar */
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
</style>
</head>
<body>

<!-- Setup modal -->
<div class="overlay" id="setup-modal">
  <div class="modal">
    <h2 style="font-size:1.25rem;font-weight:700;margin-bottom:8px">歡迎使用英文學習助手 🎓</h2>
    <p>請輸入你的 OpenAI API 金鑰，它只存在你的瀏覽器裡，不會上傳任何地方。</p>
    <label class="lbl">OpenAI API 金鑰</label>
    <input type="password" id="setup-key" placeholder="sk-proj-..." class="mb3">
    <p style="margin-bottom:20px">到 <strong style="color:var(--accent)">platform.openai.com/api-keys</strong> → Create new secret key 取得</p>
    <button class="btn blue" style="width:100%;justify-content:center;padding:12px" onclick="setupKey()">開始使用 →</button>
  </div>
</div>

<!-- Settings modal -->
<div class="overlay hide" id="cfg-modal">
  <div class="modal">
    <h2 style="font-size:1.1rem;font-weight:700;margin-bottom:14px">⚙️ 設定</h2>
    <label class="lbl">OpenAI API 金鑰</label>
    <input type="password" id="cfg-key" class="mb3">
    <div class="row">
      <button class="btn blue" style="flex:1;justify-content:center" onclick="saveSettings()">儲存</button>
      <button class="btn gray" style="flex:1;justify-content:center" onclick="hideModal('cfg-modal')">取消</button>
    </div>
  </div>
</div>

<!-- Header -->
<header>
  <div class="header-left">
    <span class="logo">🎓</span>
    <h1>英文學習助手</h1>
  </div>
  <button class="icon-btn" onclick="openSettings()" title="設定">⚙️</button>
</header>

<!-- Tabs -->
<nav class="tabs">
  <button class="tab on"  onclick="showTab('today',this)"   >📝 今日學習</button>
  <button class="tab"     onclick="showTab('history',this)" >📅 歷史紀錄</button>
  <button class="tab"     onclick="showTab('practice',this)">🧠 練習模式</button>
</nav>

<!-- TODAY -->
<section class="page on" id="page-today">
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <div>
        <div style="font-size:.7rem;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px">今天</div>
        <div style="font-weight:700;color:var(--text);font-size:1rem" id="today-date"></div>
      </div>
      <span class="badge" id="cnt">0 句</span>
    </div>
    <label class="lbl mb3">輸入中文句子（每行一句，建議 10–20 句）</label>
    <textarea id="zh-in" placeholder="今天天氣真的很好。&#10;我想去公園散步。&#10;你有時間一起吃午飯嗎？"></textarea>
    <div class="row">
      <button class="btn blue" id="trans-btn" onclick="doTranslate()">🔄 翻譯</button>
      <button class="btn green" id="save-btn" disabled onclick="saveSession()">💾 儲存今日</button>
      <button class="btn gray" onclick="clearToday()">🗑️ 清除</button>
    </div>
  </div>
  <div id="results"></div>
</section>

<!-- HISTORY -->
<section class="page" id="page-history">
  <div class="sec">學習紀錄</div>
  <div id="hist-list"></div>
</section>

<!-- PRACTICE -->
<section class="page" id="page-practice">
  <div class="card">
    <div class="sec">練習設定</div>
    <label class="lbl mb3">選擇要練習的日期</label>
    <select id="prac-sel"><option value="">-- 選擇日期 --</option></select>
    <button class="btn green" style="margin-top:12px;width:100%;justify-content:center" onclick="startPractice()">開始練習 💪</button>
  </div>
  <div id="prac-list"></div>
</section>

<!-- Dictionary popup -->
<div id="dict">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
    <strong id="dict-word" style="color:var(--accent);font-size:1.05rem"></strong>
    <button onclick="closeDict()" style="background:none;border:none;cursor:pointer;color:var(--text3);font-size:1rem">✕</button>
  </div>
  <div id="dict-body"></div>
</div>

<script>
// ── state ──────────────────────────────────────────
let sessions  = JSON.parse(localStorage.getItem('eng_sessions') || '{}');
let todayData = [];
let sMap      = {};
let recordings= {};
let recorder  = null;
let recFor    = null;
let recChunks = [];
let ttsUtter  = null;

const $   = id => document.getElementById(id);
const esc = s  => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const today = () => new Date().toISOString().slice(0,10);

function init(){
  if(!localStorage.getItem('anthropic_key')) $('setup-modal').classList.remove('hide');
  const d = new Date();
  $('today-date').textContent = d.toLocaleDateString('zh-TW',{year:'numeric',month:'long',day:'numeric',weekday:'long'});
  $('zh-in').addEventListener('input', updateCnt);
  if(sessions[today()]){
    todayData = sessions[today()];
    todayData.forEach(s => sMap[s.id] = s);
    $('zh-in').value = todayData.map(s=>s.chinese).join('\n');
    $('save-btn').disabled = false;
    renderResults(todayData, 'results');
  }
  updateCnt();
}

function updateCnt(){
  const n = $('zh-in').value.trim().split('\n').filter(l=>l.trim()).length;
  $('cnt').textContent = n + ' 句';
}

function hideModal(id){ $(id).classList.add('hide'); }

function setupKey(){
  const k = $('setup-key').value.trim();
  if(!k.startsWith('sk-')){ alert('請輸入正確的 OpenAI API 金鑰（以 sk- 開頭）'); return; }
  localStorage.setItem('anthropic_key', k);
  hideModal('setup-modal');
}

function openSettings(){
  $('cfg-key').value = localStorage.getItem('anthropic_key')||'';
  $('cfg-modal').classList.remove('hide');
}

function saveSettings(){
  const k = $('cfg-key').value.trim();
  if(!k.startsWith('sk-')){ alert('請輸入正確的 API 金鑰'); return; }
  localStorage.setItem('anthropic_key', k);
  hideModal('cfg-modal');
  alert('已更新！');
}

async function doTranslate(){
  const key = localStorage.getItem('anthropic_key');
  if(!key){ alert('請先設定 API 金鑰'); return; }
  const raw = $('zh-in').value.trim();
  if(!raw){ alert('請輸入中文句子'); return; }
  const lines = raw.split('\n').filter(l=>l.trim());
  const btn = $('trans-btn');
  btn.innerHTML = '<span class="spin"></span> 翻譯中…';
  btn.disabled = true;
  try{
    const res = await fetch('https://api.openai.com/v1/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
      body:JSON.stringify({
        model:'gpt-4o-mini',max_tokens:2048,
        messages:[{role:'user',content:`請將以下中文句子逐行翻譯成自然流暢的英文口語。\n規則：每一行輸入對應一行輸出，只輸出英文翻譯，不要加任何說明或編號。\n\n${lines.join('\n')}`}]
      })
    });
    if(!res.ok){ const e=await res.json(); throw new Error(e.error?.message||'API 錯誤 '+res.status); }
    const data = await res.json();
    const enLines = data.choices[0].message.content.trim().split('\n').filter(l=>l.trim());
    todayData = lines.map((zh,i)=>({id:`s${Date.now()}_${i}`,chinese:zh.trim(),english:enLines[i]||''}));
    todayData.forEach(s=>sMap[s.id]=s);
    renderResults(todayData,'results');
    $('save-btn').disabled = false;
  }catch(err){
    alert('翻譯失敗：'+err.message);
  }finally{
    btn.innerHTML='🔄 翻譯';btn.disabled=false;
  }
}

function wordify(en){
  return en.split(' ').map(tok=>{
    const w=tok.replace(/[^a-zA-Z']/g,'');
    if(!w) return esc(tok);
    return `<span class="w" data-word="${w.toLowerCase()}">${esc(tok)}</span>`;
  }).join(' ');
}

function renderResults(sentences,targetId){
  const el=$(targetId);
  if(!sentences.length){ el.innerHTML=''; return; }
  el.innerHTML=`<div class="sec">翻譯結果（${sentences.length} 句）</div>`+sentences.map((s,i)=>cardHTML(s,i)).join('');
}

function cardHTML(s,i){
  return `
  <div class="s-card" id="card-${s.id}">
    <div class="s-num">第 ${i+1} 句</div>
    <div class="zh">🇹🇼 ${esc(s.chinese)}</div>
    <div class="en">🇺🇸 ${wordify(s.english)}</div>
    <div class="acts">
      <button class="icon-btn" data-speak="${s.id}" title="播放朗讀">🔊</button>
      <button class="icon-btn" data-rec="${s.id}" id="rb-${s.id}" title="錄音">🎤</button>
      <span id="rp-${s.id}"></span>
    </div>
  </div>`;
}

document.addEventListener('click', e=>{
  const sp=e.target.closest('[data-speak]');
  if(sp){ speak(sp.dataset.speak,sp); return; }
  const rc=e.target.closest('[data-rec]');
  if(rc){ toggleRec(rc.dataset.rec); return; }
  const wd=e.target.closest('.w');
  if(wd){ lookupWord(wd.dataset.word); return; }
});

function speak(id,btn){
  const s=sMap[id]; if(!s) return;
  if(ttsUtter){
    speechSynthesis.cancel();ttsUtter=null;
    document.querySelectorAll('[data-speak]').forEach(b=>b.textContent='🔊');
    if(btn?.textContent==='⏹️') return;
  }
  ttsUtter=new SpeechSynthesisUtterance(s.english);
  ttsUtter.lang='en-US';ttsUtter.rate=0.85;
  ttsUtter.onstart=()=>{ if(btn) btn.textContent='⏹️'; };
  ttsUtter.onend  =()=>{ ttsUtter=null; if(btn) btn.textContent='🔊'; };
  speechSynthesis.speak(ttsUtter);
}

async function toggleRec(id){
  if(recFor===id && recorder?.state==='recording'){ recorder.stop(); return; }
  if(recorder?.state==='recording') recorder.stop();
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    recChunks=[];recFor=id;
    recorder=new MediaRecorder(stream);
    recorder.ondataavailable=e=>recChunks.push(e.data);
    recorder.onstop=()=>{
      const blob=new Blob(recChunks,{type:'audio/webm'});
      const url=URL.createObjectURL(blob);
      recordings[id]=url;
      const rp=$(`rp-${id}`);
      if(rp) rp.innerHTML=`<span class="rec-chip">🎵 <button class="btn gray sm" onclick="playRec('${id}')">播放錄音</button></span>`;
      const rb=$(`rb-${id}`);
      if(rb){rb.classList.remove('rec-on');rb.textContent='🎤';}
      stream.getTracks().forEach(t=>t.stop());recFor=null;
    };
    recorder.start();
    const rb=$(`rb-${id}`);
    if(rb){rb.classList.add('rec-on');rb.textContent='⏹️';}
  }catch{
    alert('無法存取麥克風，請確認瀏覽器已允許麥克風權限。');
  }
}
function playRec(id){ const u=recordings[id]; if(u) new Audio(u).play(); }

async function lookupWord(word){
  if(!word) return;
  $('dict-word').textContent=word;
  $('dict-body').innerHTML='<p style="font-size:.82rem;color:var(--text3)">查詢中…</p>';
  $('dict').classList.add('show');
  try{
    const r=await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`);
    if(!r.ok) throw new Error('查無此字');
    const [entry]=await r.json();
    let html='';
    const ph=entry.phonetics?.find(p=>p.text)||entry.phonetics?.[0];
    if(ph?.text)  html+=`<p style="font-size:.82rem;color:var(--text3);margin-bottom:7px">${ph.text}</p>`;
    if(ph?.audio) html+=`<audio controls src="${ph.audio}" style="width:100%;height:26px;margin-bottom:8px"></audio>`;
    entry.meanings.slice(0,3).forEach(m=>{
      html+=`<p style="margin:7px 0 4px"><span class="badge">${m.partOfSpeech}</span></p>`;
      m.definitions.slice(0,2).forEach(d=>{
        html+=`<p style="font-size:.82rem;color:var(--text2);margin:3px 0">• ${esc(d.definition)}</p>`;
        if(d.example) html+=`<p style="font-size:.78rem;color:var(--text3);margin-left:10px;font-style:italic">"${esc(d.example)}"</p>`;
      });
    });
    html+=`<p style="margin-top:10px;font-size:.78rem"><a href="https://dictionary.cambridge.org/dictionary/english/${word}" target="_blank" style="color:var(--accent)">劍橋字典 →</a></p>`;
    $('dict-body').innerHTML=html;
  }catch(err){
    $('dict-body').innerHTML=`<p style="font-size:.82rem;color:var(--text3)">${err.message}</p>
      <p style="margin-top:8px;font-size:.78rem"><a href="https://dictionary.cambridge.org/dictionary/english/${word}" target="_blank" style="color:var(--accent)">劍橋字典查詢 →</a></p>`;
  }
}
function closeDict(){ $('dict').classList.remove('show'); }

function saveSession(){
  if(!todayData.length) return;
  sessions[today()]=todayData;
  localStorage.setItem('eng_sessions',JSON.stringify(sessions));
  const btn=$('save-btn');
  btn.textContent='✅ 已儲存！';
  setTimeout(()=>{ btn.innerHTML='💾 儲存今日'; },2000);
}
function clearToday(){
  if(todayData.length && !confirm('確定清除今日的翻譯結果嗎？')) return;
  todayData.forEach(s=>delete sMap[s.id]);
  todayData=[];
  $('zh-in').value='';$('results').innerHTML='';
  $('save-btn').disabled=true;updateCnt();
}

function showTab(name,btn){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));
  $(`page-${name}`).classList.add('on');btn.classList.add('on');
  if(name==='history')  renderHistory();
  if(name==='practice') renderPracticeOpts();
}

function renderHistory(){
  const dates=Object.keys(sessions).sort((a,b)=>b.localeCompare(a));
  if(!dates.length){
    $('hist-list').innerHTML='<div class="empty">📭<br>還沒有學習紀錄<br><span style="font-size:.82rem">先在今日學習頁面輸入並儲存句子</span></div>';
    return;
  }
  $('hist-list').innerHTML=dates.map(d=>{
    const ss=sessions[d];ss.forEach(s=>sMap[s.id]=s);
    return `
    <button class="hist-btn" onclick="toggleHist('${d}')">
      <span>📅 ${d}</span><span class="badge">${ss.length} 句</span>
    </button>
    <div class="hist-detail" id="hd-${d}">
      ${ss.map((s,i)=>`
      <div class="s-card">
        <div class="s-num">第 ${i+1} 句</div>
        <div class="zh">🇹🇼 ${esc(s.chinese)}</div>
        <div class="en">🇺🇸 ${wordify(s.english)}</div>
        <div class="acts"><button class="icon-btn" data-speak="${s.id}" title="播放">🔊</button></div>
      </div>`).join('')}
    </div>`;
  }).join('');
}
function toggleHist(d){ $(`hd-${d}`)?.classList.toggle('open'); }

function renderPracticeOpts(){
  const dates=Object.keys(sessions).sort((a,b)=>b.localeCompare(a));
  $('prac-sel').innerHTML='<option value="">-- 選擇日期 --</option>'+
    dates.map(d=>`<option value="${d}">${d}（${sessions[d].length} 句）</option>`).join('');
}
function startPractice(){
  const d=$('prac-sel').value;
  if(!d||!sessions[d]){ alert('請先選擇一個日期'); return; }
  const ss=sessions[d];ss.forEach(s=>sMap[s.id]=s);
  $('prac-list').innerHTML=`<div class="sec">${d} 的練習（${ss.length} 句）</div>`+
    ss.map((s,i)=>`
    <div class="p-card">
      <div class="s-num">第 ${i+1} 句</div>
      <div class="zh" style="font-size:1rem;font-weight:700;color:var(--text)">🇹🇼 ${esc(s.chinese)}</div>
      <input type="text" placeholder="試著翻譯成英文…" style="margin-top:9px">
      <div class="acts" style="margin-top:8px">
        <button class="btn gray sm" onclick="this.closest('.p-card').querySelector('.answer').classList.toggle('show')">👁️ 顯示答案</button>
        <button class="icon-btn" data-speak="${s.id}" title="聽正確發音">🔊</button>
      </div>
      <div class="answer">✅ ${esc(s.english)}</div>
    </div>`).join('');
}

init();
</script>
</body>
</html>
