<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英文學習助手</title>
<style>
/* ── Hyperspace-inspired design system ── */
:root{
  --bg:       #312450;
  --bg2:      #271e40;
  --bg3:      #3d2d60;
  --surface:  rgba(255,255,255,0.05);
  --surface2: rgba(255,255,255,0.08);
  --border:   rgba(255,255,255,0.15);
  --border2:  rgba(255,255,255,0.25);
  --g1:       #5e42a6;
  --g2:       #b74e91;
  --gradient: linear-gradient(to right,#5e42a6,#b74e91);
  --text:     #ffffff;
  --text2:    rgba(255,255,255,0.65);
  --text3:    rgba(255,255,255,0.35);
  --green:    #5ec4a6;
  --green-bg: rgba(94,196,166,0.1);
  --green-bd: rgba(94,196,166,0.3);
  --red:      #e06c8a;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text2);
  min-height:100vh;
  line-height:1.75;
  background-image:
    radial-gradient(ellipse at 0% 0%,rgba(94,66,166,.35) 0%,transparent 55%),
    radial-gradient(ellipse at 100% 100%,rgba(183,78,145,.2) 0%,transparent 55%);
}

/* ── overlay / modal ── */
.overlay{
  position:fixed;inset:0;
  background:rgba(30,18,50,.85);
  backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;z-index:200;
}
.overlay.hide{display:none}
.modal{
  background:var(--bg2);
  border:1px solid var(--border2);
  border-radius:4px;
  padding:36px 32px;
  width:min(480px,92vw);
  box-shadow:0 30px 80px rgba(0,0,0,.5);
  position:relative;
  overflow:hidden;
}
.modal::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:var(--gradient);
}
.modal h2{
  color:var(--text);font-size:1.3rem;font-weight:700;
  margin-bottom:6px;padding-bottom:12px;
  border-bottom:1px solid var(--border);
}
.modal p{color:var(--text2);font-size:.88rem;margin:10px 0}

/* ── header ── */
header{
  background:var(--bg2);
  padding:14px 22px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:20;
}
.header-brand{display:flex;align-items:center;gap:12px}
.header-brand h1{
  font-size:1rem;font-weight:700;color:var(--text);letter-spacing:.08em;text-transform:uppercase;
}
.header-brand h1 span{
  background:var(--gradient);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}

/* ── tabs ── */
.tabs{
  background:var(--bg2);
  display:flex;
  border-bottom:1px solid var(--border);
  position:sticky;top:53px;z-index:10;
}
.tab{
  flex:1;padding:14px 8px;text-align:center;
  font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  cursor:pointer;border:none;background:none;color:var(--text3);
  border-bottom:2px solid transparent;transition:color .2s,border-color .2s;
}
.tab.on{color:var(--text);border-bottom-color:var(--g2)}
.tab:hover{color:var(--text2)}

/* ── pages ── */
.page{display:none;padding:28px 20px;max-width:740px;margin:0 auto}
.page.on{display:block}

/* ── section title ── */
.sec-title{
  color:var(--text);font-size:.72rem;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;
  margin-bottom:16px;padding-bottom:10px;
  position:relative;
}
.sec-title::after{
  content:'';position:absolute;bottom:0;left:0;
  width:100%;height:1px;
  background:var(--gradient);
  border-radius:1px;
}

/* ── card ── */
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:4px;
  padding:22px;margin-bottom:16px;
}

/* ── form ── */
.lbl{
  display:block;font-size:.72rem;font-weight:700;
  color:var(--text3);letter-spacing:.1em;text-transform:uppercase;margin-bottom:7px;
}
textarea,input[type=text],input[type=password],select{
  width:100%;
  background:rgba(0,0,0,.2);
  border:1px solid var(--border);
  border-radius:3px;
  padding:10px 14px;
  font-size:.95rem;font-family:inherit;
  color:var(--text);
  transition:border-color .2s,box-shadow .2s;
}
textarea{resize:vertical;min-height:130px;line-height:1.75}
textarea:focus,input:focus,select:focus{
  outline:none;
  border-color:var(--g2);
  box-shadow:0 0 0 2px rgba(183,78,145,.2);
}
select option{background:var(--bg2);color:var(--text)}
::placeholder{color:var(--text3)}

/* ── buttons ── */
.btn{
  display:inline-flex;align-items:center;gap:7px;
  padding:10px 22px;border-radius:3px;
  font-family:Arial,Helvetica,sans-serif;
  font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  cursor:pointer;border:none;transition:all .2s;white-space:nowrap;
}
.btn:disabled{opacity:.35;cursor:not-allowed}

.btn-primary{
  background:transparent;
  color:var(--text);
  border:2px solid var(--g1);
  position:relative;overflow:hidden;
}
.btn-primary::before{
  content:'';position:absolute;inset:0;
  background:var(--gradient);opacity:0;transition:opacity .2s;
}
.btn-primary:hover:not(:disabled)::before{opacity:1}
.btn-primary span{position:relative;z-index:1}

.btn-solid{
  background:var(--gradient);
  color:#fff;
  border:none;
  box-shadow:0 4px 16px rgba(94,66,166,.3);
}
.btn-solid:hover:not(:disabled){
  box-shadow:0 4px 24px rgba(183,78,145,.5);
  transform:translateY(-1px);
  filter:brightness(1.1);
}

.btn-ghost{
  background:transparent;color:var(--text3);
  border:1px solid var(--border);
}
.btn-ghost:hover{color:var(--text2);border-color:var(--border2);background:var(--surface2)}

.btn-sm{padding:5px 12px;font-size:.72rem}

.icon-btn{
  background:transparent;border:1px solid var(--border);border-radius:3px;
  cursor:pointer;font-size:.9rem;padding:7px 10px;
  transition:all .2s;color:var(--text3);
}
.icon-btn:hover{color:var(--text);border-color:var(--g2);background:rgba(183,78,145,.1)}
.icon-btn.rec-on{color:var(--red);border-color:var(--red);background:rgba(224,108,138,.1);animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

.spin{
  display:inline-block;width:13px;height:13px;
  border:2px solid rgba(255,255,255,.2);border-top-color:#fff;
  border-radius:50%;animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── sentence card ── */
.s-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:4px;padding:16px 20px;margin-bottom:10px;
  transition:border-color .2s,background .2s;
  position:relative;overflow:hidden;
}
.s-card::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--gradient);
}
.s-card:hover{border-color:var(--border2);background:var(--surface2)}

.s-num{
  font-size:.65rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--text3);margin-bottom:8px;
}
.zh{font-size:.9rem;color:var(--text2);margin-bottom:6px}
.en{font-size:1rem;font-weight:700;color:var(--text);line-height:1.65;margin-bottom:12px}
.en .w{
  cursor:pointer;
  border-bottom:1px dotted rgba(255,255,255,.3);
  transition:color .15s,border-color .15s;
}
.en .w:hover{color:var(--g2);border-bottom-color:var(--g2)}
.acts{display:flex;gap:7px;flex-wrap:wrap;align-items:center}

.rec-chip{
  display:inline-flex;align-items:center;gap:5px;padding:3px 10px;
  background:var(--green-bg);border:1px solid var(--green-bd);
  border-radius:3px;font-size:.72rem;color:var(--green);
  letter-spacing:.04em;
}

/* ── history ── */
.hist-btn{
  width:100%;text-align:left;padding:14px 18px;
  background:var(--surface);border:1px solid var(--border);border-radius:4px;
  cursor:pointer;margin-bottom:8px;
  display:flex;justify-content:space-between;align-items:center;
  font-size:.88rem;color:var(--text2);transition:.2s;
}
.hist-btn:hover{border-color:var(--border2);color:var(--text);background:var(--surface2)}
.hist-detail{display:none;padding-left:12px;margin-top:4px}
.hist-detail.open{display:block}

/* ── practice ── */
.p-card{
  background:var(--surface);border:1px solid var(--border);border-radius:4px;
  padding:16px 20px;margin-bottom:10px;position:relative;overflow:hidden;
}
.p-card::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  background:linear-gradient(to bottom,var(--green),#2d8a70);
}
.answer{
  display:none;margin-top:10px;
  padding:10px 14px;
  background:var(--green-bg);border:1px solid var(--green-bd);
  border-radius:3px;color:var(--green);font-size:.92rem;
}
.answer.show{display:block}
.ai-fb{
  display:none;margin-top:10px;padding:11px 14px;
  background:rgba(94,66,166,.1);border:1px solid rgba(94,66,166,.3);
  border-radius:3px;font-size:.86rem;color:var(--text2);line-height:1.7;
}
.ai-fb.show{display:block}

/* ── dictionary popup ── */
#dict{
  position:fixed;bottom:18px;right:18px;width:295px;max-height:380px;overflow-y:auto;
  background:var(--bg2);border:1px solid var(--border2);border-radius:4px;padding:18px;
  box-shadow:0 12px 48px rgba(0,0,0,.5);
  z-index:50;display:none;
}
#dict::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:var(--gradient);
}
#dict.show{display:block}
#dict::-webkit-scrollbar{width:4px}
#dict::-webkit-scrollbar-track{background:transparent}
#dict::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:2px}

/* ── badge ── */
.badge{
  display:inline-block;padding:2px 9px;border-radius:2px;
  font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  background:rgba(94,66,166,.25);color:var(--g2);
  border:1px solid rgba(183,78,145,.3);
}

/* ── misc ── */
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
.mb3{margin-bottom:12px}
.empty{
  text-align:center;padding:50px 20px;
  color:var(--text3);font-size:.9rem;line-height:2;
}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:3px}

/* ── highlight & notes ── */
.s-card.hl{border-left-color:#f59e0b;background:rgba(245,158,11,.04)}
.hl-btn{
  background:none;border:none;cursor:pointer;font-size:1.05rem;
  padding:2px 4px;line-height:1;opacity:.22;transition:.2s;flex-shrink:0;
}
.hl-btn:hover{opacity:.7}
.hl-btn.on{opacity:1;filter:drop-shadow(0 0 5px rgba(245,158,11,.8))}
.notes-panel{margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.notes-lbl{font-size:.67rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--text3);margin-bottom:7px}
.notes-ta{
  width:100%;background:rgba(0,0,0,.2);border:1px solid var(--border);
  border-radius:3px;padding:9px 12px;font-size:.86rem;font-family:inherit;
  color:var(--text);resize:vertical;min-height:65px;line-height:1.65;transition:border-color .2s;
}
.notes-ta:focus{outline:none;border-color:var(--g1)}
.notes-ta::placeholder{color:var(--text3)}
.chat-wrap{margin-top:9px;display:none}
.chat-wrap.open{display:block}
.chat-msgs{max-height:200px;overflow-y:auto;margin-bottom:8px;display:flex;flex-direction:column;gap:7px}
.chat-msgs::-webkit-scrollbar{width:3px}
.chat-msgs::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.chat-u{text-align:right}
.chat-u span{
  display:inline-block;background:rgba(94,66,166,.22);border:1px solid rgba(94,66,166,.3);
  border-radius:10px 10px 2px 10px;padding:6px 11px;max-width:88%;text-align:left;
  font-size:.83rem;color:var(--text2);line-height:1.55;
}
.chat-a span{
  display:inline-block;background:rgba(255,255,255,.05);border:1px solid var(--border);
  border-radius:2px 10px 10px 10px;padding:6px 11px;max-width:95%;
  font-size:.83rem;color:var(--text2);line-height:1.55;
}
.chat-row{display:flex;gap:6px;margin-top:5px}
.chat-row input{flex:1;font-size:.84rem;padding:6px 11px}

/* ── gradient text utility ── */
.grad-text{
  background:var(--gradient);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}

/* ── play buttons ── */
.play-grp{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:0}
.play-btn{
  font-size:.78rem;padding:6px 14px;letter-spacing:.03em;
  line-height:1.3;white-space:nowrap;border-radius:5px;
  border-color:rgba(255,255,255,.1);
  transition:border-color .22s, box-shadow .22s, color .22s, background .22s, opacity .22s;
}
.icon-btn.play-btn:hover{
  color:var(--text);
  border-color:var(--g1);
  background:rgba(94,66,166,.08);
  box-shadow:0 0 0 2px rgba(94,66,166,.18), 0 0 16px rgba(94,66,166,.22);
}
.icon-btn.play-btn.p-active{
  border-color:var(--g2);
  color:#fff;
  background:rgba(183,78,145,.1);
  box-shadow:0 0 0 2px rgba(183,78,145,.28), 0 0 24px rgba(183,78,145,.48);
}
.play-btn.p-dim{opacity:.28;box-shadow:none!important}
.play-btn svg{display:inline-block;vertical-align:-2px;flex-shrink:0}

/* ── header brand hover ── */
.header-brand{cursor:pointer;transition:opacity .2s}
.header-brand:hover{opacity:.75}

/* ── now-playing bar ── */
#now-playing{
  position:fixed;bottom:0;left:0;right:0;
  background:var(--bg2);
  border-top:1px solid var(--border2);
  padding:10px 14px;
  display:none;align-items:center;gap:10px;
  z-index:100;
  box-shadow:0 -8px 28px rgba(0,0,0,.45);
  overflow:hidden;
}
#now-playing::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:var(--gradient);
}
#np-mode{
  font-size:.68rem;font-weight:700;letter-spacing:.06em;
  color:var(--g2);white-space:nowrap;text-transform:uppercase;
  min-width:40px;
}
#np-info{
  flex:1;min-width:0;display:flex;align-items:baseline;gap:8px;overflow:hidden;
}
#np-num{
  font-size:.72rem;font-weight:700;color:var(--g2);white-space:nowrap;
  background:rgba(183,78,145,.15);border:1px solid rgba(183,78,145,.3);
  border-radius:2px;padding:1px 6px;
}
#np-zh{
  font-size:.88rem;color:var(--text2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.np-btn{
  background:transparent;border:1px solid var(--border);border-radius:3px;
  color:var(--text2);font-size:.72rem;padding:5px 10px;cursor:pointer;
  white-space:nowrap;transition:.2s;font-family:inherit;
  letter-spacing:.04em;
}
.np-btn:hover{border-color:var(--border2);color:var(--text)}
.np-btn.stop{border-color:var(--g2);color:var(--g2)}
.np-btn.stop:hover{background:rgba(183,78,145,.15)}

/* ── volume slider ── */
.vol-row{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.vol-pct{font-size:.8rem;color:var(--text2);min-width:36px;text-align:right}
input[type=range]{
  -webkit-appearance:none;flex:1;height:4px;
  background:var(--border);border-radius:2px;
  outline:none;border:none;padding:0;cursor:pointer;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:16px;height:16px;
  border-radius:50%;background:var(--g2);cursor:pointer;
  box-shadow:0 0 6px rgba(183,78,145,.5);
}
input[type=range]::-moz-range-thumb{
  width:16px;height:16px;border-radius:50%;
  background:var(--g2);cursor:pointer;border:none;
}
</style>
</head>
<body>

<!-- Setup modal -->
<div class="overlay hide" id="setup-modal">
  <div class="modal">
    <h2>歡迎使用 <span class="grad-text">英文學習助手</span></h2>
    <p>請輸入你的 OpenAI API 金鑰。它只儲存在你的瀏覽器本機，不會上傳任何地方。</p>
    <label class="lbl" style="margin-top:14px">OpenAI API 金鑰</label>
    <input type="password" id="setup-key" placeholder="sk-proj-..." class="mb3">
    <p style="margin-bottom:20px;font-size:.8rem">到 <strong style="color:var(--text)">platform.openai.com/api-keys</strong> 取得金鑰</p>
    <button class="btn btn-solid" style="width:100%;justify-content:center;padding:13px;font-size:.85rem" onclick="setupKey()">
      開始使用
    </button>
  </div>
</div>

<!-- Settings modal -->
<div class="overlay hide" id="cfg-modal">
  <div class="modal">
    <h2>⚙️ 設定</h2>
    <label class="lbl" style="margin-top:14px">OpenAI API 金鑰</label>
    <input type="password" id="cfg-key" class="mb3">

    <label class="lbl" style="margin-top:6px">🔊 AI 語音音量</label>
    <div class="vol-row">
      <input type="range" id="tts-vol" min="0" max="1" step="0.05"
             oninput="updateVol('tts',this.value)">
      <span class="vol-pct" id="tts-vol-pct"></span>
    </div>

    <label class="lbl">🎤 錄音回放音量</label>
    <div class="vol-row" style="margin-bottom:20px">
      <input type="range" id="rec-vol" min="0" max="1" step="0.05"
             oninput="updateVol('rec',this.value)">
      <span class="vol-pct" id="rec-vol-pct"></span>
    </div>

    <div class="row" style="margin-top:4px">
      <button class="btn btn-solid" style="flex:1;justify-content:center" onclick="saveSettings()">儲存</button>
      <button class="btn btn-ghost" style="flex:1;justify-content:center" onclick="hideModal('cfg-modal')">取消</button>
    </div>
  </div>
</div>

<!-- Header -->
<header>
  <div class="header-brand" onclick="location.reload()" title="重新整理頁面">
    <span style="font-size:1.4rem;filter:drop-shadow(0 0 6px rgba(183,78,145,.6))">🎓</span>
    <h1>英文<span>學習</span>助手</h1>
  </div>
  <button class="icon-btn" onclick="openSettings()" title="設定">⚙️</button>
</header>

<!-- Tabs -->
<nav class="tabs">
  <button class="tab on"  onclick="showTab('today',this)"   >📝&ensp;今日學習</button>
  <button class="tab"     onclick="showTab('history',this)" >📅&ensp;歷史紀錄</button>
  <button class="tab"     onclick="showTab('practice',this)">🧠&ensp;練習模式</button>
  <button class="tab"     onclick="showTab('notes',this)"   >⭐&ensp;重點筆記</button>
</nav>

<!-- TODAY -->
<section class="page on" id="page-today">
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px">
      <div>
        <div style="font-size:.65rem;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);margin-bottom:4px">今日日期</div>
        <div style="font-weight:700;color:var(--text);font-size:1.05rem" id="today-date"></div>
      </div>
      <span class="badge" id="cnt">0 句</span>
    </div>
    <label class="lbl">輸入中文句子（每行一句，建議 10–20 句）</label>
    <textarea id="zh-in" placeholder="今天天氣真的很好。&#10;我想去公園散步。&#10;你有時間一起吃午飯嗎？" style="margin-bottom:4px"></textarea>
    <div class="row">
      <button class="btn btn-solid" id="trans-btn" onclick="doTranslate()"><span>🔄</span>&ensp;翻譯</button>
      <button class="btn btn-primary" id="save-btn" disabled onclick="saveSession()"><span>💾</span>&ensp;儲存今日</button>
      <button class="btn btn-ghost" onclick="clearToday()"><span>🗑️</span>&ensp;清除</button>
    </div>
  </div>
  <div id="results"></div>
</section>

<!-- HISTORY -->
<section class="page" id="page-history">
  <div class="sec-title">學習紀錄</div>
  <div style="position:relative;margin-bottom:14px">
    <input type="text" id="hist-search"
      placeholder="🔍  搜尋句子關鍵字（中文或英文）…"
      oninput="filterHistory(this.value)"
      style="padding-left:16px">
    <span id="search-count"
      style="position:absolute;right:12px;top:50%;transform:translateY(-50%);
             font-size:.72rem;letter-spacing:.06em;color:var(--text3);pointer-events:none">
    </span>
  </div>
  <div id="hist-list"></div>
</section>

<!-- PRACTICE -->
<section class="page" id="page-practice">
  <div class="card">
    <div class="sec-title">練習設定</div>
    <label class="lbl">選擇要練習的日期</label>
    <select id="prac-sel" style="margin-bottom:14px"><option value="">── 選擇日期 ──</option></select>
    <button class="btn btn-solid" style="width:100%;justify-content:center" onclick="startPractice()">開始練習 💪</button>
  </div>
  <div id="prac-list"></div>
</section>

<!-- NOTES (重點筆記) -->
<section class="page" id="page-notes">
  <div class="sec-title">⭐ 重點筆記</div>
  <div id="notes-list"></div>
</section>

<!-- Dictionary popup -->
<div id="dict">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
    <strong id="dict-word" class="grad-text" style="font-size:1.05rem"></strong>
    <button onclick="closeDict()"
      style="background:rgba(255,255,255,.1);border:1px solid var(--border2);
             cursor:pointer;color:var(--text);font-size:1rem;border-radius:50%;
             width:30px;height:30px;display:flex;align-items:center;justify-content:center;
             flex-shrink:0;transition:.2s;line-height:1"
      onmouseover="this.style.background='rgba(183,78,145,.3)'"
      onmouseout="this.style.background='rgba(255,255,255,.1)'">✕</button>
  </div>
  <div id="dict-body"></div>
</div>

<!-- Now Playing Bar -->
<div id="now-playing">
  <span id="np-mode"></span>
  <div id="np-info">
    <span id="np-num"></span>
    <span id="np-zh"></span>
  </div>
  <button class="np-btn" onclick="scrollToPlaying()" title="定位到這一句">📍 定位</button>
  <button class="np-btn stop" onclick="stopPlayback()">⏹ 停止</button>
</div>

<script>
// ── state ──────────────────────────────────────────
let sessions  = JSON.parse(localStorage.getItem('eng_sessions') || '{}');
let todayData = [];
let sMap      = {};
let recordings= {};
let recorder  = null;
let recFor    = null;
let recChunks = [];
let ttsUtter  = null;
let playId    = null;
let playMode  = null;
let shadowTimer = null;
let ttsVolume  = parseFloat(localStorage.getItem('tts_vol') || '0.9');
let recVolume  = parseFloat(localStorage.getItem('rec_vol') || '0.5');
let highlights = JSON.parse(localStorage.getItem('eng_highlights') || '{}');

const $   = id => document.getElementById(id);
const esc = s  => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const today = () => new Date().toISOString().slice(0,10);

function init(){
  if(!localStorage.getItem('anthropic_key')) $('setup-modal').classList.remove('hide');
  const d = new Date();
  $('today-date').textContent = d.toLocaleDateString('zh-TW',{year:'numeric',month:'long',day:'numeric',weekday:'long'});
  $('zh-in').addEventListener('input', updateCnt);
  if(sessions[today()]){
    todayData = sessions[today()];
    todayData.forEach(s => sMap[s.id] = s);
    $('zh-in').value = todayData.map(s=>s.chinese).join('\n');
    $('save-btn').disabled = false;
    renderResults(todayData, 'results');
  }
  updateCnt();
}

function updateCnt(){
  const n = $('zh-in').value.trim().split('\n').filter(l=>l.trim()).length;
  $('cnt').textContent = n + ' 句';
}

function hideModal(id){ $(id).classList.add('hide'); }

function setupKey(){
  const k = $('setup-key').value.trim();
  if(!k.startsWith('sk-')){ alert('請輸入正確的 OpenAI API 金鑰（以 sk- 開頭）'); return; }
  localStorage.setItem('anthropic_key', k);
  hideModal('setup-modal');
}

function openSettings(){
  $('cfg-key').value = localStorage.getItem('anthropic_key')||'';
  $('tts-vol').value = ttsVolume;
  $('tts-vol-pct').textContent = Math.round(ttsVolume*100)+'%';
  $('rec-vol').value = recVolume;
  $('rec-vol-pct').textContent = Math.round(recVolume*100)+'%';
  $('cfg-modal').classList.remove('hide');
}

function updateVol(type, val){
  const v = parseFloat(val);
  if(type==='tts'){
    ttsVolume=v; localStorage.setItem('tts_vol', v);
    $('tts-vol-pct').textContent=Math.round(v*100)+'%';
  } else {
    recVolume=v; localStorage.setItem('rec_vol', v);
    $('rec-vol-pct').textContent=Math.round(v*100)+'%';
  }
}

function saveSettings(){
  const k = $('cfg-key').value.trim();
  if(!k.startsWith('sk-')){ alert('請輸入正確的 API 金鑰'); return; }
  localStorage.setItem('anthropic_key', k);
  hideModal('cfg-modal');
  alert('已更新！');
}

async function doTranslate(){
  const key = localStorage.getItem('anthropic_key');
  if(!key){ alert('請先設定 API 金鑰'); return; }
  const raw = $('zh-in').value.trim();
  if(!raw){ alert('請輸入中文句子'); return; }
  const lines = raw.split('\n').filter(l=>l.trim());
  const btn = $('trans-btn');
  btn.innerHTML = '<span class="spin"></span>&ensp;翻譯中…';
  btn.disabled = true;
  try{
    const res = await fetch('https://api.openai.com/v1/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
      body:JSON.stringify({
        model:'gpt-4o-mini',max_tokens:2048,
        messages:[{role:'user',content:`請將以下中文句子逐行翻譯成自然流暢的英文口語。\n規則：每一行輸入對應一行輸出，只輸出英文翻譯，不要加任何說明或編號。\n\n${lines.join('\n')}`}]
      })
    });
    if(!res.ok){ const e=await res.json(); throw new Error(e.error?.message||'API 錯誤 '+res.status); }
    const data = await res.json();
    const enLines = data.choices[0].message.content.trim().split('\n').filter(l=>l.trim());
    todayData = lines.map((zh,i)=>({id:`s${Date.now()}_${i}`,chinese:zh.trim(),english:enLines[i]||''}));
    todayData.forEach(s=>sMap[s.id]=s);
    renderResults(todayData,'results');
    $('save-btn').disabled = false;
  }catch(err){
    alert('翻譯失敗：'+err.message);
  }finally{
    btn.innerHTML='<span>🔄</span>&ensp;翻譯';btn.disabled=false;
  }
}

function wordify(en){
  return en.split(' ').map(tok=>{
    const w=tok.replace(/[^a-zA-Z']/g,'');
    if(!w) return esc(tok);
    return `<span class="w" data-word="${w.toLowerCase()}">${esc(tok)}</span>`;
  }).join(' ');
}

function renderResults(sentences,targetId){
  const el=$(targetId);
  if(!sentences.length){ el.innerHTML=''; return; }
  el.innerHTML=`<div class="sec-title">翻譯結果（${sentences.length} 句）</div>`+sentences.map((s,i)=>cardHTML(s,i)).join('');
}

function cardHTML(s,i,opts){
  const o=opts||{};
  const numLabel=o.numLabel!==undefined?o.numLabel:`第 ${i+1} 句`;
  const showRec=o.showRec!==false;
  const hl=!!highlights[s.id];
  return `
  <div class="s-card${hl?' hl':''}" id="card-${s.id}">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px">
      <div class="s-num" style="margin:0">${numLabel}</div>
      <button class="hl-btn${hl?' on':''}" id="hlbtn-${s.id}"
        onclick="toggleHighlight('${s.id}')" title="${hl?'取消標記':'標記為重點'}">⭐</button>
    </div>
    <div class="zh">🇹🇼&ensp;${esc(s.chinese)}</div>
    <div class="en">🇺🇸&ensp;${wordify(s.english)}</div>
    <div class="acts">
      <div class="play-grp">
        <button class="icon-btn play-btn" data-play="once"   data-pid="${s.id}" title="播放一次">${SVG.play} 一次</button>
        <button class="icon-btn play-btn" data-play="loop"   data-pid="${s.id}" title="循環播放">${SVG.repeat} 循環</button>
        <button class="icon-btn play-btn" data-play="shadow" data-pid="${s.id}" title="跟讀練習（播一段、停一段）">${SVG.headphones} 跟讀</button>
      </div>
      ${showRec?`<button class="icon-btn" data-rec="${s.id}" id="rb-${s.id}" title="錄音">🎤</button><span id="rp-${s.id}"></span>`:''}
    </div>
    ${hl?notesPanelHTML(s.id):''}
  </div>`;
}

function notesPanelHTML(id){
  const h=highlights[id]||{};
  const note=h.note||'';
  const disc=h.discussion||[];
  const chatOpen=disc.length>0;
  const msgs=disc.map(m=>
    `<div class="chat-${m.role==='user'?'u':'a'}"><span>${esc(m.content).replace(/\n/g,'<br>')}</span></div>`
  ).join('');
  return `
  <div class="notes-panel" id="notes-panel-${id}">
    <div class="notes-lbl">📝 我的筆記</div>
    <textarea class="notes-ta" id="note-ta-${id}"
      placeholder="輸入你的想法、疑問…&#10;例如：這個用法跟我想的哪裡不同？跟哪個句子類似？"
      onblur="saveNote('${id}',this.value)">${esc(note)}</textarea>
    <div style="margin-top:8px">
      <button class="btn btn-ghost btn-sm" onclick="toggleAIChat('${id}')">🤖 與 AI 討論</button>
    </div>
    <div class="chat-wrap${chatOpen?' open':''}" id="aichat-${id}">
      <div class="chat-msgs" id="chat-msgs-${id}">${msgs}</div>
      <div class="chat-row">
        <input type="text" id="chat-q-${id}" placeholder="輸入問題…（Enter 送出）"
          onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendAI('${id}');}">
        <button class="btn btn-solid btn-sm" onclick="sendAI('${id}')">送出</button>
      </div>
    </div>
  </div>`;
}

// ── highlight & notes ─────────────────────────────────────────
function saveHighlights(){ localStorage.setItem('eng_highlights',JSON.stringify(highlights)); }

function toggleHighlight(id){
  const s=sMap[id]; if(!s) return;
  // Save any unsaved textarea content first
  document.querySelectorAll('.notes-ta').forEach(ta=>{
    const tid=ta.id.replace('note-ta-','');
    if(highlights[tid]) highlights[tid].note=ta.value;
  });
  if(highlights[id]){
    delete highlights[id];
  } else {
    let date=today();
    for(const d of Object.keys(sessions)){
      if(sessions[d].find(x=>x.id===id)){date=d;break;}
    }
    highlights[id]={note:'',discussion:[],date,chinese:s.chinese,english:s.english};
  }
  saveHighlights();
  // Re-render whichever tab is active
  const active=document.querySelector('.page.on')?.id;
  if(active==='page-today')  renderResults(todayData,'results');
  else if(active==='page-history')  renderHistory();
  else if(active==='page-notes')    renderNotes();
}

function saveNote(id,text){
  if(!highlights[id]) return;
  highlights[id].note=text;
  saveHighlights();
}

function toggleAIChat(id){
  const wrap=document.getElementById('aichat-'+id);
  if(wrap) wrap.classList.toggle('open');
}

async function sendAI(id){
  const s=sMap[id]; if(!s) return;
  const key=localStorage.getItem('anthropic_key');
  if(!key){alert('請先在設定中輸入 API 金鑰');return;}
  const inputEl=document.getElementById('chat-q-'+id);
  const question=(inputEl?.value||'').trim();
  if(!question) return;
  // Save textarea note before we read discussion
  const ta=document.getElementById('note-ta-'+id);
  if(ta&&highlights[id]) highlights[id].note=ta.value;
  const note=highlights[id]?.note||'';
  const disc=highlights[id]?.discussion||[];
  // Show user message immediately
  const msgsEl=document.getElementById('chat-msgs-'+id);
  if(msgsEl){
    msgsEl.insertAdjacentHTML('beforeend',
      `<div class="chat-u"><span>${esc(question)}</span></div>`+
      `<div class="chat-a" id="ai-typing-${id}"><span style="opacity:.5">AI 正在思考中…</span></div>`);
    msgsEl.scrollTop=msgsEl.scrollHeight;
  }
  inputEl.value='';
  const sendBtn=inputEl?.nextElementSibling;
  if(sendBtn) sendBtn.disabled=true;
  disc.push({role:'user',content:question});
  const sysMsg=`你是英文學習助手，幫助學習者深入理解英文句子。請用繁體中文回答，精簡且具體。
學習者正在學習這個句子：
中文：${s.chinese}
英文：${s.english}${note?`\n學習者的筆記：${note}`:''}`;
  try{
    const res=await fetch('https://api.openai.com/v1/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
      body:JSON.stringify({model:'gpt-4o-mini',max_tokens:700,
        messages:[{role:'system',content:sysMsg},...disc]})
    });
    if(!res.ok){const e=await res.json();throw new Error(e.error?.message||res.status);}
    const data=await res.json();
    const reply=data.choices[0].message.content;
    const typing=document.getElementById('ai-typing-'+id);
    if(typing) typing.querySelector('span').innerHTML=esc(reply).replace(/\n/g,'<br>');
    disc.push({role:'assistant',content:reply});
    if(highlights[id]) highlights[id].discussion=disc;
    saveHighlights();
    if(msgsEl) msgsEl.scrollTop=msgsEl.scrollHeight;
  }catch(err){
    const typing=document.getElementById('ai-typing-'+id);
    if(typing) typing.querySelector('span').innerHTML=`<span style="color:#f87171">錯誤：${esc(err.message)}</span>`;
  }finally{
    if(sendBtn) sendBtn.disabled=false;
  }
}

function renderNotes(){
  const ids=Object.keys(highlights);
  if(!ids.length){
    $('notes-list').innerHTML=`<div class="empty">⭐<br>還沒有標記任何重點<br><span style="font-size:.82rem">點句子右上角的 ⭐ 按鈕來標記重點句子</span></div>`;
    return;
  }
  // Group by date, newest first
  const byDate={};
  ids.forEach(id=>{
    const h=highlights[id];
    if(!byDate[h.date]) byDate[h.date]=[];
    byDate[h.date].push({id,...h});
  });
  const dates=Object.keys(byDate).sort((a,b)=>b.localeCompare(a));
  $('notes-list').innerHTML=dates.map(d=>{
    const items=byDate[d];
    return `
    <button class="hist-btn" onclick="toggleHist('notes-${d}')">
      <span>📅&ensp;${d}</span>
      <span class="badge">${items.length} 個重點</span>
    </button>
    <div class="hist-detail open" id="hd-notes-${d}">
      ${items.map(h=>{
        sMap[h.id]={id:h.id,chinese:h.chinese,english:h.english};
        return cardHTML({id:h.id,chinese:h.chinese,english:h.english},0,
          {numLabel:'⭐ 重點',showRec:false});
      }).join('')}
    </div>`;
  }).join('');
}

// ── end highlight & notes ──────────────────────────────────────

document.addEventListener('click', e=>{
  const pb=e.target.closest('[data-play]');
  if(pb){ handlePlay(pb.dataset.play, pb.dataset.pid); return; }
  const rc=e.target.closest('[data-rec]');
  if(rc){ toggleRec(rc.dataset.rec); return; }
  const wd=e.target.closest('.w');
  if(wd){ lookupWord(wd.dataset.word); return; }
});

// ── playback labels / icons ──────────────────────────
const SVG = {
  play:`<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 3 20 12 6 21 6 3"/></svg>`,
  repeat:`<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>`,
  headphones:`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 18 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3"/></svg>`,
  pause:`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="10" x2="10" y1="15" y2="9"/><line x1="14" x2="14" y1="15" y2="9"/></svg>`,
};
const PLAY_LABELS = {once:SVG.play+' 一次', loop:SVG.repeat+' 循環', shadow:SVG.headphones+' 跟讀'};

function stopPlayback(){
  speechSynthesis.cancel();
  if(shadowTimer){clearTimeout(shadowTimer);shadowTimer=null;}
  ttsUtter=null;
  if(playId){
    document.querySelectorAll(`.play-btn[data-pid="${playId}"]`).forEach(b=>{
      b.innerHTML=PLAY_LABELS[b.dataset.play]||SVG.play;
      b.classList.remove('p-active','p-dim');
    });
  }
  playId=null; playMode=null;
  hideNowPlaying();
}

function showNowPlaying(id, mode){
  const s=sMap[id]; if(!s) return;
  // Find sentence number: search today first, then history
  let num='?';
  const ti=todayData.findIndex(x=>x.id===id);
  if(ti>=0){ num=ti+1; }
  else {
    for(const d of Object.keys(sessions)){
      const i=sessions[d].findIndex(x=>x.id===id);
      if(i>=0){ num=i+1; break; }
    }
  }
  const modeLabel={once:'▶ 播放',loop:'🔁 循環',shadow:'🎧 跟讀'}[mode]||mode;
  $('np-mode').textContent=modeLabel;
  $('np-num').textContent=`第 ${num} 句`;
  $('np-zh').textContent=s.chinese;
  $('now-playing').style.display='flex';
  requestAnimationFrame(()=>{
    const barH=$('now-playing').offsetHeight;
    document.querySelectorAll('.page').forEach(p=>p.style.paddingBottom=(barH+10)+'px');
    $('dict').style.bottom=(18+barH)+'px';
  });
}

function hideNowPlaying(){
  $('now-playing').style.display='none';
  document.querySelectorAll('.page').forEach(p=>p.style.paddingBottom='');
  $('dict').style.bottom='';
}

function scrollToPlaying(){
  if(!playId) return;
  const card=document.getElementById(`card-${playId}`);
  if(card){
    card.scrollIntoView({behavior:'smooth',block:'center'});
    // Flash highlight
    card.style.borderColor='var(--g2)';
    card.style.boxShadow='0 0 0 2px rgba(183,78,145,.4)';
    setTimeout(()=>{ card.style.borderColor=''; card.style.boxShadow=''; },1800);
  }
}

function setPlayUI(id, activeMode){
  document.querySelectorAll(`.play-btn[data-pid="${id}"]`).forEach(b=>{
    if(b.dataset.play===activeMode){
      b.innerHTML=SVG.pause+' 停止';
      b.classList.add('p-active'); b.classList.remove('p-dim');
    } else {
      b.innerHTML=PLAY_LABELS[b.dataset.play]||SVG.play;
      b.classList.add('p-dim'); b.classList.remove('p-active');
    }
  });
}

function handlePlay(mode, id){
  if(playId===id && playMode===mode){ stopPlayback(); return; }
  stopPlayback();
  const s=sMap[id]; if(!s) return;
  playId=id; playMode=mode;
  setPlayUI(id, mode);
  showNowPlaying(id, mode);
  if(mode==='once')   playOnce(id,s);
  else if(mode==='loop')   playLoop(id,s);
  else if(mode==='shadow') playShadow(id,s);
}

function mkUtter(text){
  const u=new SpeechSynthesisUtterance(text);
  u.lang='en-US'; u.rate=0.85; u.volume=ttsVolume;
  return u;
}

function playOnce(id,s){
  ttsUtter=mkUtter(s.english);
  ttsUtter.onend=()=>{ stopPlayback(); };
  speechSynthesis.speak(ttsUtter);
}

function playLoop(id,s){
  function doLoop(){
    if(playId!==id||playMode!=='loop') return;
    ttsUtter=mkUtter(s.english);
    ttsUtter.onend=()=>{
      if(playId===id&&playMode==='loop')
        shadowTimer=setTimeout(doLoop,400);
    };
    speechSynthesis.speak(ttsUtter);
  }
  doLoop();
}

function playShadow(id,s){
  function doShadow(){
    if(playId!==id||playMode!=='shadow') return;
    let t0=null;
    ttsUtter=mkUtter(s.english);
    ttsUtter.onstart=()=>{ t0=Date.now(); };
    ttsUtter.onend=()=>{
      if(playId!==id||playMode!=='shadow') return;
      const spoken=t0?Date.now()-t0:2000;
      const pause=Math.max(spoken,1200);
      shadowTimer=setTimeout(doShadow, pause);
    };
    speechSynthesis.speak(ttsUtter);
  }
  doShadow();
}

async function toggleRec(id){
  if(recFor===id && recorder?.state==='recording'){ recorder.stop(); return; }
  if(recorder?.state==='recording') recorder.stop();
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    recChunks=[];recFor=id;
    recorder=new MediaRecorder(stream);
    recorder.ondataavailable=e=>recChunks.push(e.data);
    recorder.onstop=()=>{
      const blob=new Blob(recChunks,{type:'audio/webm'});
      const url=URL.createObjectURL(blob);
      recordings[id]=url;
      const rp=$(`rp-${id}`);
      if(rp) rp.innerHTML=`<span class="rec-chip">🎵&ensp;<button class="btn btn-ghost btn-sm" onclick="playRec('${id}')">播放錄音</button></span>`;
      const rb=$(`rb-${id}`);
      if(rb){rb.classList.remove('rec-on');rb.textContent='🎤';}
      stream.getTracks().forEach(t=>t.stop());recFor=null;
    };
    recorder.start();
    const rb=$(`rb-${id}`);
    if(rb){rb.classList.add('rec-on');rb.textContent='⏹️';}
  }catch{
    alert('無法存取麥克風，請確認瀏覽器已允許麥克風權限。');
  }
}
function playRec(id){
  const u=recordings[id]; if(!u) return;
  const a=new Audio(u); a.volume=recVolume; a.play();
}

async function lookupWord(word){
  if(!word) return;
  $('dict-word').textContent=word;
  $('dict-body').innerHTML='<p style="font-size:.82rem;color:var(--text3)">查詢中…</p>';
  $('dict').classList.add('show');
  // If now-playing bar is visible, keep dict above it
  if($('now-playing').style.display==='flex'){
    $('dict').style.bottom=(18+$('now-playing').offsetHeight)+'px';
  }
  try{
    const r=await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`);
    if(!r.ok) throw new Error('查無此字');
    const [entry]=await r.json();
    let html='';
    const ph=entry.phonetics?.find(p=>p.text)||entry.phonetics?.[0];
    if(ph?.text)  html+=`<p style="font-size:.82rem;color:var(--text3);margin-bottom:6px">${ph.text}</p>`;
    if(ph?.audio) html+=`<audio controls src="${ph.audio}" style="width:100%;height:26px;margin-bottom:8px"></audio>`;
    entry.meanings.slice(0,3).forEach(m=>{
      html+=`<p style="margin:7px 0 4px"><span class="badge">${m.partOfSpeech}</span></p>`;
      m.definitions.slice(0,2).forEach(d=>{
        html+=`<p style="font-size:.82rem;color:var(--text2);margin:3px 0">• ${esc(d.definition)}</p>`;
        if(d.example) html+=`<p style="font-size:.78rem;color:var(--text3);margin-left:10px;font-style:italic">"${esc(d.example)}"</p>`;
      });
    });
    html+=`<p style="margin-top:10px;font-size:.78rem"><a href="https://dictionary.cambridge.org/dictionary/english-chinese-traditional/${word}" target="_blank" style="color:var(--g2);border-bottom:1px dotted rgba(183,78,145,.5)">劍橋英漢字典 →</a></p>`;
    $('dict-body').innerHTML=html;
  }catch(err){
    $('dict-body').innerHTML=`<p style="font-size:.82rem;color:var(--text3)">${err.message}</p>
      <p style="margin-top:8px;font-size:.78rem"><a href="https://dictionary.cambridge.org/dictionary/english-chinese-traditional/${word}" target="_blank" style="color:var(--g2)">劍橋英漢字典查詢 →</a></p>`;
  }
}
function closeDict(){ $('dict').classList.remove('show'); }

function saveSession(){
  if(!todayData.length) return;
  sessions[today()]=todayData;
  localStorage.setItem('eng_sessions',JSON.stringify(sessions));
  const btn=$('save-btn');
  const orig=btn.innerHTML;
  btn.innerHTML='✅&ensp;已儲存！';
  setTimeout(()=>{ btn.innerHTML=orig; },2000);
}

function clearToday(){
  if(todayData.length && !confirm('確定清除今日的翻譯結果嗎？')) return;
  todayData.forEach(s=>delete sMap[s.id]);
  todayData=[];
  $('zh-in').value='';$('results').innerHTML='';
  $('save-btn').disabled=true;updateCnt();
}

function showTab(name,btn){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));
  $(`page-${name}`).classList.add('on');btn.classList.add('on');
  if(name==='history')  renderHistory();
  if(name==='practice') renderPracticeOpts();
  if(name==='notes')    renderNotes();
}

function renderHistory(){
  const dates=Object.keys(sessions).sort((a,b)=>b.localeCompare(a));
  if(!dates.length){
    $('hist-list').innerHTML='<div class="empty">📭<br>還沒有學習紀錄<br><span style="font-size:.82rem">先在今日學習頁面輸入並儲存句子</span></div>';
    return;
  }
  $('hist-list').innerHTML=dates.map(d=>{
    const ss=sessions[d];ss.forEach(s=>sMap[s.id]=s);
    return `
    <button class="hist-btn" onclick="toggleHist('${d}')">
      <span>📅&ensp;${d}</span>
      <span class="badge">${ss.length} 句</span>
    </button>
    <div class="hist-detail" id="hd-${d}">
      ${ss.map((s,i)=>cardHTML(s,i,{showRec:false})).join('')}
    </div>`;
  }).join('');
}
function toggleHist(d){ $(`hd-${d}`)?.classList.toggle('open'); }

function highlight(text, q){
  if(!q) return esc(text);
  const safe = q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return esc(text).replace(new RegExp(safe,'gi'),
    m=>`<mark style="background:rgba(183,78,145,.35);color:#fff;border-radius:2px;padding:0 2px">${m}</mark>`);
}

function filterHistory(query){
  const q = query.trim().toLowerCase();
  const dates = Object.keys(sessions).sort((a,b)=>b.localeCompare(a));
  const countEl = $('search-count');

  if(!dates.length){
    $('hist-list').innerHTML='<div class="empty">📭<br>還沒有學習紀錄</div>';
    countEl.textContent=''; return;
  }

  if(!q){
    renderHistory(); countEl.textContent=''; return;
  }

  let totalMatches = 0;
  let html = '';

  dates.forEach(d=>{
    const ss = sessions[d];
    const matched = ss.filter(s=>
      s.chinese.toLowerCase().includes(q) ||
      s.english.toLowerCase().includes(q)
    );
    if(!matched.length) return;
    totalMatches += matched.length;
    ss.forEach(s=>sMap[s.id]=s);

    html += `
    <button class="hist-btn" onclick="toggleHist('search-${d}')">
      <span>📅&ensp;${d}</span>
      <span class="badge">${matched.length} 筆符合</span>
    </button>
    <div class="hist-detail open" id="hd-search-${d}">
      ${matched.map((s,i)=>cardHTML(s,i,{numLabel:d,showRec:false})).join('')}
    </div>`;
  });

  if(!html){
    $('hist-list').innerHTML=`<div class="empty">🔍<br>找不到含有「${esc(query)}」的句子</div>`;
    countEl.textContent='';
  } else {
    $('hist-list').innerHTML = html;
    countEl.textContent = `共 ${totalMatches} 筆`;
  }
}

function renderPracticeOpts(){
  const dates=Object.keys(sessions).sort((a,b)=>b.localeCompare(a));
  $('prac-sel').innerHTML='<option value="">── 選擇日期 ──</option>'+
    dates.map(d=>`<option value="${d}">${d}（${sessions[d].length} 句）</option>`).join('');
}

function startPractice(){
  const d=$('prac-sel').value;
  if(!d||!sessions[d]){ alert('請先選擇一個日期'); return; }
  const ss=sessions[d];ss.forEach(s=>sMap[s.id]=s);
  $('prac-list').innerHTML=`<div class="sec-title">${d} 的練習（${ss.length} 句）</div>`+
    ss.map((s,i)=>`
    <div class="p-card">
      <div class="s-num">第 ${i+1} 句</div>
      <div class="zh" style="font-size:.97rem;font-weight:700;color:var(--text)">🇹🇼&ensp;${esc(s.chinese)}</div>
      <input type="text" id="prac-in-${s.id}" placeholder="試著翻譯成英文…"
        style="margin-top:10px"
        onkeydown="if(event.key==='Enter')aiCheck('${s.id}',this.parentElement.querySelector('.ai-check-btn'))">
      <div class="acts" style="margin-top:9px">
        <button class="btn btn-ghost btn-sm" onclick="this.closest('.p-card').querySelector('.answer').classList.toggle('show')">👁️&ensp;顯示答案</button>
        <button class="btn btn-solid btn-sm ai-check-btn" onclick="aiCheck('${s.id}',this)">🤖&ensp;AI 批改</button>
        <button class="icon-btn play-btn" data-play="once" data-pid="${s.id}" title="聽正確發音">${SVG.play} 播放</button>
      </div>
      <div class="answer">✅&ensp;${esc(s.english)}</div>
      <div class="ai-fb" id="ai-fb-${s.id}"></div>
    </div>`).join('');
}

async function aiCheck(id, btn){
  const s=sMap[id]; if(!s) return;
  const key=localStorage.getItem('anthropic_key');
  if(!key){alert('請先在設定中輸入 API 金鑰');return;}
  const input=document.getElementById('prac-in-'+id);
  const userAns=(input?.value||'').trim();
  if(!userAns){alert('請先輸入你的翻譯答案');return;}
  const fbEl=document.getElementById('ai-fb-'+id);
  if(!fbEl) return;
  fbEl.innerHTML='<span style="opacity:.5">AI 正在評估中…</span>';
  fbEl.classList.add('show');
  if(btn) btn.disabled=true;
  const prompt=`你是一位友善的英文老師，請評估學習者的英文翻譯答案。

原文中文：${s.chinese}
標準英文翻譯：${s.english}
學習者的答案：${userAns}

請用繁體中文簡潔回答，格式如下：
第一行：先給評分標籤（選一個）：✅ 正確 / ⚠️ 大致正確，可接受 / ❌ 需要修改
然後：簡要說明差異或問題（1-3 行，如果完全正確就不用多說）
最後：如有需要，用「建議：」開頭給出更好的說法`;
  try{
    const res=await fetch('https://api.openai.com/v1/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
      body:JSON.stringify({model:'gpt-4o-mini',max_tokens:400,
        messages:[{role:'user',content:prompt}]})
    });
    if(!res.ok){const e=await res.json();throw new Error(e.error?.message||res.status);}
    const data=await res.json();
    const reply=data.choices[0].message.content;
    fbEl.innerHTML=esc(reply).replace(/\n/g,'<br>');
  }catch(err){
    fbEl.innerHTML=`<span style="color:#f87171">錯誤：${esc(err.message)}</span>`;
  }finally{
    if(btn) btn.disabled=false;
  }
}

init();

// ── 背景持續播放修正 ────────────────────────────────
// iOS Safari 在 DOM 變動或切頁時會偷暫停 TTS，每 250ms 偵測並恢復
setInterval(()=>{
  if(playId && playMode && speechSynthesis.paused){
    speechSynthesis.resume();
  }
}, 250);

// 從其他分頁/App 切回來時，恢復播放
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden || !playId || !playMode) return;
  if(speechSynthesis.paused){
    speechSynthesis.resume();
  } else if(!speechSynthesis.speaking && !speechSynthesis.pending){
    // TTS 被完全停掉了，重新啟動
    const s = sMap[playId];
    if(s){
      if(playMode==='loop')   playLoop(playId, s);
      else if(playMode==='shadow') playShadow(playId, s);
    }
  }
});
</script>
